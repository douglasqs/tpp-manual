name: Atualizar empresas parceiras

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-companies
  cancel-in-progress: false

jobs:
  refresh-directory:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Testar leitura da planilha
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Atualizar dados da planilha
        run: python3 scripts/update_companies.py

      - name: Publicar novos dados no repositório
        run: |
          if git diff --quiet -- companies-data.js; then
            echo "A lista já está atualizada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add companies-data.js
          git commit -m "Atualiza empresas parceiras"
          git push

      - name: Preparar arquivos do site
        run: python3 -B scripts/build_site.py

      - name: Enviar arquivos para o GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: refresh-directory
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar site atualizado
        id: deployment
        uses: actions/deploy-pages@v4
